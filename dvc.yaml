stages: 
  
  data_ingestion: 
    cmd: python src/data/data_ingestion_component.py
    deps:
    - src/data/data_ingestion_component.py
    params: 
    - data_ingestion.test_size
    outs:
    - data/raw

  data_preprocessing: 
    cmd: python src/data/data_preprocessing_component.py
    deps:
    - data/raw/train.csv
    - data/raw/test.csv
    - src/data/data_preprocessing_component.py    
    outs:
    - data/interim
