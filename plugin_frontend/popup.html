<!DOCTYPE html>
<html>
<head>
  <title>YouTube Comment Insights</title>
  <style>
    /* Light Theme */
    body {
      font-family: Arial, sans-serif;
      padding: 10px;
      background-color: #f4f4f5; /* Light gray background */
      color: #18181b; /* Dark text */
      margin: 0;
      box-sizing: border-box;
      width: 320px; /* Set a width that fits the Chrome extension popup */
    }
    h1 {
      font-size: 20px;
      color: #000000;
    }
    .section {
      margin-bottom: 15px;
    }
    .section-title {
      font-weight: bold;
      color: #0077cc; /* Kept the blue, it looks good on light mode */
      margin-top: 10px;
      font-size: 16px;
    }
    .comment-list {
      list-style: none;
      padding: 0;
    }
    .comment-item {
      margin: 8px 0;
      padding: 8px;
      background-color: #ffffff; /* White background for items */
      border: 1px solid #e4e4e7; /* Light border */
      border-radius: 4px;
    }
    .comment-sentiment {
      font-weight: bold;
      color: #3f3f46; /* Darker sentiment color */
    }
    /* Image Styling */
    img {
      width: 100%;
      margin-top: 20px;
      border-radius: 4px; /* Added slight rounding to images */
    }
    /* Metrics Styling */
    .metrics-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
    }
    .metric {
      width: 48%;
      background-color: #ffffff; /* White background */
      border: 1px solid #e4e4e7; /* Light border */
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      box-sizing: border-box;
    }
    .metric-title {
      font-size: 12px;
      color: #52525b; /* Medium gray for titles */
    }
    .metric-value {
      font-size: 22px;
      font-weight: bold;
      color: #18181b; /* Dark text */
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h1>YouTube Comment Insights</h1>
  <div id="output" class="section"></div>
  <script src="config.js"></script>
  <script src="popup.js"></script> 
</body>
</html>
